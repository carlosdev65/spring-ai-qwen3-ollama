spring.application.name=spring-ai-qwen3-ollama
server.port=8080

# ============================================================
# OLLAMA
# ============================================================

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.model.chat=ollama
spring.ai.ollama.chat.model=qwen3:4b


# ============================================================
# IDIOMA E COMPORTAMENTO DO MODELO
# ============================================================

# Instrui o Qwen3 a responder no mesmo idioma da pergunta.
# Para perguntas em português, responder em português.
spring.ai.ollama.chat.options.system=Responda sempre no mesmo idioma utilizado pelo usuário. Se a pergunta estiver em português, responda exclusivamente em português do Brasil. Não traduza a pergunta. Não altere o idioma da resposta sem que o usuário solicite explicitamente.


# ============================================================
# DESEMPENHO - RYZEN 7 / 16 GB RAM
# ============================================================

# Contexto suficiente para perguntas e respostas normais
spring.ai.ollama.chat.num-ctx=4096

# Processamento em lote
spring.ai.ollama.chat.num-batch=256

# Ollama determina automaticamente as threads
spring.ai.ollama.chat.num-thread=0

# Limita o tamanho máximo da resposta
spring.ai.ollama.chat.num-predict=512


# ============================================================
# RESPOSTAS RÁPIDAS E CONSISTENTES
# ============================================================

spring.ai.ollama.chat.temperature=0.2

# Desabilita o thinking para reduzir tempo de resposta
spring.ai.ollama.chat.think=false

# Mantém o modelo carregado na memória
spring.ai.ollama.chat.keep-alive=30m


# ============================================================
# SAMPLING
# ============================================================

spring.ai.ollama.chat.top-k=40
spring.ai.ollama.chat.top-p=0.9
spring.ai.ollama.chat.min-p=0.05
spring.ai.ollama.chat.repeat-penalty=1.1


# ============================================================
# MODELO LOCAL
# ============================================================

# O modelo deve ser instalado previamente:
#
# ollama pull qwen3:4b
#
# Não fazer download durante o startup do Spring Boot.
spring.ai.ollama.init.pull-model-strategy=never